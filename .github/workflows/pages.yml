name: pages

# Publishes the on-device app (pnpm pages:build) to https://<owner>.github.io/<repo>/.
# While the repository is private, or Pages is not switched on yet, the deploy job is skipped, so a run stays green and quiet.
# After the repository is public and Settings > Pages > Source is "GitHub Actions", a push to main or "Run workflow" publishes
# it (apps/web/README.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a 404 means "Pages is not switched on"; any other answer lets the deploy job try, so a real problem is not hidden.
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q "Not Found"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not switched on for this repository (Settings > Pages > Source > GitHub Actions): nothing to publish."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: check
    if: ${{ !github.event.repository.private && needs.check.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pages:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist-pages
          # Keeps the empty .nojekyll; .git and .github are left out either way.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
