<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wally is offline</title>
<style>
:root { color-scheme: light dark; --bg: #F4F7FE; --ink: #0E1A33; --muted: #4F5B78; --primary: #1A5CFF; --on-primary: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --bg: #0B1220; --ink: #EAF0FF; --muted: #A7B3CF; --primary: #3366F5; --on-primary: #FFFFFF; } }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang HK", "Noto Sans HK", sans-serif; text-align: center; }
main { padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); max-width: 22rem; }
h1 { font-size: 1.375rem; margin: 1rem 0 0.25rem; }
p { margin: 0; color: var(--muted); }
a { display: inline-flex; align-items: center; min-height: 3rem; margin-top: 1.5rem; padding: 0 1.5rem; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
<main>
<svg class="wally__svg" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><ellipse class="wally__ground" cx="60" cy="110" rx="32" ry="4.5" fill="rgb(14 26 51 / 0.12)"></ellipse><g class="wally__body"><g transform="rotate(-10 58 33)"><rect x="30" y="12" width="58" height="40" rx="7" fill="#19C3A6"></rect><rect x="30" y="21" width="58" height="7" fill="#0E9C84"></rect></g><rect x="12" y="34" width="96" height="72" rx="24" fill="#1A5CFF"></rect><path d="M12 60 V58 A24 24 0 0 1 36 34 H84 A24 24 0 0 1 108 58 V60 Z" fill="#1240C4"></path><rect x="82" y="46" width="26" height="22" rx="11" fill="#1240C4"></rect><circle cx="95" cy="57" r="4.5" fill="#19C3A6"></circle><g class="wally__eyes" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"><path d="M38 76 Q46 84 54 76"></path><path d="M64 76 Q72 84 80 76"></path></g><ellipse class="wally__mouth" cx="59" cy="94" rx="4" ry="3" fill="#FFFFFF"></ellipse></g><g class="wally__zz" fill="#4F5B78" font-family="ui-rounded, system-ui, sans-serif" font-weight="800"><text class="wally__z" x="98" y="34" font-size="16">z</text><text class="wally__z wally__z--2" x="108" y="20" font-size="11">z</text></g></svg>
<h1>You're offline</h1>
<p>Open Wally again when you're back online. Nothing was charged: payments here are simulated.</p>
<!-- NEEDS-REVIEW zh-HK -->
<p lang="zh-HK">你已離線。重新連線後再開啟 Wally。沒有任何扣款：這裏的付款只是模擬。</p>
<a href="./">Try again</a>
</main>
</body>
</html>
